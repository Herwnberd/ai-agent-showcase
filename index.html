<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美妆主图制作</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #app { width: 100%; height: 100vh; position: relative; }
    #app iframe { width: 100% !important; height: 100% !important; border: none !important; position: absolute !important; top: 0 !important; left: 0 !important; }
  </style>
</head>
<body>
  <div id='app'></div>
  <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/builder-web-sdk/0.1.1-beta.1/dist/umd/index.js"></script>
  <script>
    // MutationObserver to ensure iframe stays fullscreen
    function fixIframeFullscreen() {
      const app = document.getElementById('app');
      if (!app) return;
      
      const observer = new MutationObserver((mutations) => {
        const iframe = app.querySelector('iframe');
        if (iframe) {
          // Force fullscreen styles using !important via inline style
          iframe.style.setProperty('width', '100%', 'important');
          iframe.style.setProperty('height', '100%', 'important');
          iframe.style.setProperty('position', 'absolute', 'important');
          iframe.style.setProperty('top', '0', 'important');
          iframe.style.setProperty('left', '0', 'important');
          iframe.style.setProperty('border', 'none', 'important');
        }
      });
      
      observer.observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
    }
    
    // Run immediately and after SDK initialization
    document.addEventListener('DOMContentLoaded', fixIframeFullscreen);
    fixIframeFullscreen(); // Also run synchronously in case DOM is already ready
  </script>

        nickname: 'User',
      },
      ui: { className: '' }
    });
  </script>
</body>
</html>
